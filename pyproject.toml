[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-agent"
version = "0.1.0"
description = "Testing agent for QA job applications: strategy, generation, execution, self-healing, analysis and Allure reporting."
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "playwright>=1.40",
    "pytest>=8.0",
    "pytest-playwright>=0.5",
    "pyyaml>=6.0",
    "allure-pytest>=2.13",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "smoke: quick smoke tests (milestone 1)",
]

[tool.ruff]
line-length = 100
